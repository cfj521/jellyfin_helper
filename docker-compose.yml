# ============================================================
# jellyfin-helper 一站式部署
# ------------------------------------------------------------
# 拉 5 个服务：jellyfin-helper（本仓构建）+ Jellyfin + Jackett +
# qBittorrent 5.2+ + Postgres 16。媒体目录和下载目录必须在 .env
# 里指定（compose 的 ${VAR:?msg} 语法会在缺失时直接拒绝启动）。
#
# 用法：
#   1. cp .env.example .env && 编辑 MEDIA_DIR / DOWNLOADS_DIR /
#      POSTGRES_PASSWORD
#   2. cp config.yaml.example config.yaml && 按 docs/docker-deploy.md
#      改 database.host=postgres 等几项
#   3. docker compose up -d
# ============================================================

name: jellyfin-helper

networks:
  default:
    name: jellyfin-helper-net
    driver: bridge

services:
  # ─────────────────────────────────────────────────────
  # PostgreSQL 16 — jellyfin-helper 业务库
  # ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jellyfin_helper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-jellyfin_helper}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jellyfin_helper} -d ${POSTGRES_DB:-jellyfin_helper}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # 不暴露端口到宿主，仅容器网络内访问；要从宿主连数据库可临时加 ports: ["5432:5432"]

  # ─────────────────────────────────────────────────────
  # Jellyfin — 媒体服务器
  # ─────────────────────────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jh-jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      JELLYFIN_PublishedServerUrl: http://jellyfin:8096
    volumes:
      - ./data/jellyfin:/config
      - ${MEDIA_DIR:?MEDIA_DIR 必须在 .env 中设置（宿主媒体库根目录）}:/media:ro
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    # 硬件转码（NVIDIA）按需开：
    # devices: ["/dev/dri:/dev/dri"]
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }

  # ─────────────────────────────────────────────────────
  # Jackett — Indexer 聚合
  # ─────────────────────────────────────────────────────
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jh-jackett
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_UPDATE: "true"
    volumes:
      - ./data/jackett:/config
    ports:
      - "${JACKETT_PORT:-9117}:9117"

  # ─────────────────────────────────────────────────────
  # qBittorrent — 下载（必须 5.2+，linuxserver:latest 已对齐）
  # ─────────────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: jh-qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      # WEBUI_PORT 容器内固定 8080，不跟 .env 的 QB_WEBUI_PORT 走——否则
      # helper / bootstrap 写死的 http://qbittorrent:8080 会连不上。
      # 改宿主端口只动下面 ports 映射的左半边即可。
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${QB_TORRENT_PORT:-6881}
    volumes:
      - ./data/qbittorrent:/config
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR 必须在 .env 中设置（宿主下载目录）}:/downloads
    ports:
      - "${QB_WEBUI_PORT:-8080}:8080"
      - "${QB_TORRENT_PORT:-6881}:${QB_TORRENT_PORT:-6881}"
      - "${QB_TORRENT_PORT:-6881}:${QB_TORRENT_PORT:-6881}/udp"

  # ─────────────────────────────────────────────────────
  # jellyfin-helper — 本仓 Dockerfile 自构建
  # ─────────────────────────────────────────────────────
  helper:
    build:
      context: .
      dockerfile: Dockerfile
    image: jellyfin-helper:local
    container_name: jh-helper
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8099"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      # 配置文件 bind mount（你本地直接改 ./config.yaml，容器看到）
      - ./config.yaml:/app/config.yaml
      # 业务数据（缓存、SQLite 副本等）
      - ./data/helper:/app/data
      - ./logs:/app/logs
      # 媒体和下载目录与 jellyfin / qb 一致路径，省 path_mappings 翻译
      - ${MEDIA_DIR:?MEDIA_DIR 必须在 .env 中设置（宿主媒体库根目录）}:/media
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR 必须在 .env 中设置（宿主下载目录）}:/downloads
      # 可选：jellyfin SQLite 直读加速（同 stack 默认能拿到）
      - ./data/jellyfin/data:/jellyfin-data:ro
    ports:
      - "${HELPER_PORT:-8099}:8099"
    depends_on:
      postgres:
        condition: service_healthy
      jellyfin:
        condition: service_started
      jackett:
        condition: service_started
      qbittorrent:
        condition: service_started

  # ─────────────────────────────────────────────────────
  # bootstrap — 一次性初始化（profile 隔离，默认不启）
  #
  # 跑法：
  #   docker compose --profile bootstrap run --rm bootstrap
  #
  # 它会：
  #   1. 预填 qBittorrent.conf（admin / jellyfin_helper、API Key、RSS 开）
  #   2. 预填 Jackett ServerConfig.json（API Key）
  #   3. Jackett 启动后添加 7 个公开 indexer
  #   4. 把两个 API Key 写回 config.yaml
  # 幂等：重复跑不会覆盖已有 key；首次跑前 qb/jackett 不需要起
  # ─────────────────────────────────────────────────────
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: jellyfin-helper:local
    container_name: jh-bootstrap
    profiles: ["bootstrap"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BOOTSTRAP_ROOT: /workspace
      QB_URL: http://qbittorrent:8080
      JACKETT_URL: http://jackett:9117
      QB_WEBUI_PORT: ${QB_WEBUI_PORT:-8080}
    volumes:
      - ./data:/workspace/data
      - ./config.yaml:/workspace/config.yaml
      - ./scripts:/workspace/scripts:ro
    working_dir: /workspace
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "scripts/bootstrap_stack.py"]
    restart: "no"
